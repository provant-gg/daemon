# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: provantgg-daemon

before:
  hooks:
    - go mod tidy

builds:
  - id: provantgg-daemon
    main: ./cmd/daemon
    binary: provantgg-daemon
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version=v{{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "6"
      - "7"
    ignore:
      # darwin doesn't ship 32-bit or 32-bit ARM
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      # windows/arm (32-bit) is unused
      - goos: windows
        goarch: arm
    # Build the Windows installer right after the windows/amd64 binary
    # is produced. The script no-ops for every other target.
    hooks:
      post:
        - cmd: ./windows/build-installer.sh "{{ .Os }}" "{{ .Arch }}" "{{ .Path }}" "{{ .Version }}" "{{ .ProjectName }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  # Attach the NSIS-built Windows installer alongside the archives.
  extra_files:
    - glob: ./dist/*_setup.exe
